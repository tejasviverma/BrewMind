<!DOCTYPE html>
<html>
<head>
    <title>BrewMind Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>BrewMind Dashboard</h1>

    <div class="container">

        <div class="card">

            <h2>Campaign Insights</h2>

            <p id="open-rate"></p>
            <p id="click-rate"></p>

        <div class="card">

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
